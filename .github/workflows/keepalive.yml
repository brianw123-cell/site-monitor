name: Keep the alarms switched on

# GitHub switches off scheduled workflows in a public repository after 60 days
# with no activity in it. Nobody will touch this repository for months, so on
# the 1st of each month this makes an empty commit, which counts as activity.
# It does not change the alarm's schedule, so failure emails still go to Brian.

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive $(date -u +%Y-%m-%d)"
          git push
